services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: md_evals
      POSTGRES_PASSWORD: md_evals
      POSTGRES_DB: md_evals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U md_evals"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - md-evals-net

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://md_evals:md_evals@db:5432/md_evals
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STATE_SECRET: ${STATE_SECRET:-change-me-state-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:4173"]}
      DEBUG: ${DEBUG:-false}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - md-evals-net

volumes:
  pgdata:

networks:
  md-evals-net:
    driver: bridge
