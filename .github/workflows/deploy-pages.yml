# Deploy frontend to GitHub Pages
# Triggers on push to main when apps/web/ or docs/ change

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Check no secrets leaked into bundle
        run: |
          if grep -r "client_secret" apps/web/dist/ 2>/dev/null; then
            echo "::error::Found client_secret in frontend bundle!"
            exit 1
          fi
          if grep -r "MASTER_KEY" apps/web/dist/ 2>/dev/null; then
            echo "::error::Found MASTER_KEY in frontend bundle!"
            exit 1
          fi
          echo "No secrets found in bundle — OK"

      - name: Assemble _site directory
        run: |
          mkdir -p _site/app _site/docs

          # 1. React app → _site/app/
          cp -r apps/web/dist/* _site/app/

          # 2. Landing page (docs/index.html) → _site/ root
          if [ -f docs/index.html ]; then
            cp docs/index.html _site/index.html
          fi

          # 3. Remaining docs content → _site/docs/
          #    (Docsify docs, guides, references, etc.)
          if [ -d docs ]; then
            # Copy everything except the landing page index.html
            rsync -a --exclude='index.html' docs/ _site/docs/
            # Use docsify.html as the docs portal index
            if [ -f docs/docsify.html ]; then
              cp docs/docsify.html _site/docs/index.html
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
