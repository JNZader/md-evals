name: RepoForge Docs Smoke Test

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'none | auto | main | subpath'
        required: false
        default: 'auto'
      confirm_deploy:
        description: 'Set true to allow deploy'
        required: false
        default: 'false'
      subpath_prefix:
        description: 'Subpath prefix when mode=subpath or auto-with-existing'
        required: false
        default: 'repoforge-smoke'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve workflow settings
        id: cfg
        shell: bash
        run: |
          MODE="${{ github.event.inputs.deploy_mode }}"
          CONFIRM="${{ github.event.inputs.confirm_deploy }}"
          PREFIX="${{ github.event.inputs.subpath_prefix }}"

          [ -z "$MODE" ] && MODE="none"
          [ -z "$CONFIRM" ] && CONFIRM="false"
          [ -z "$PREFIX" ] && PREFIX="repoforge-smoke"

          SANITIZED_PREFIX="$(echo "$PREFIX" | tr -cs 'a-zA-Z0-9/._-' '-' | sed 's#^/*##;s#/*$##')"
          [ -z "$SANITIZED_PREFIX" ] && SANITIZED_PREFIX="repoforge-smoke"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "confirm=$CONFIRM" >> "$GITHUB_OUTPUT"
          echo "prefix=$SANITIZED_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Preflight Pages state
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/"

          API_URL="https://api.github.com/repos/${{ github.repository }}/pages"
          HTTP_CODE=$(curl -sS -o pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")

          if [ "$HTTP_CODE" = "200" ]; then
            BUILD_TYPE=$(python3 -c "import json; print(json.load(open('pages.json', encoding='utf-8')).get('build_type', 'unknown'))")
            PAGES_ENABLED=true
          else
            BUILD_TYPE="unknown"
            PAGES_ENABLED=false
          fi

          LIVE_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$PAGES_URL" || true)
          if [ "$LIVE_CODE" = "200" ]; then
            EXISTING_LIVE=true
          else
            EXISTING_LIVE=false
          fi

          echo "pages_url=$PAGES_URL" >> "$GITHUB_OUTPUT"
          echo "pages_enabled=$PAGES_ENABLED" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "existing_live=$EXISTING_LIVE" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy target
        id: plan
        shell: bash
        run: |
          MODE="${{ steps.cfg.outputs.mode }}"
          CONFIRM="${{ steps.cfg.outputs.confirm }}"
          PREFIX="${{ steps.cfg.outputs.prefix }}"
          BUILD_TYPE="${{ steps.preflight.outputs.build_type }}"
          EXISTING="${{ steps.preflight.outputs.existing_live }}"

          DEPLOY=false
          TARGET="none"
          REASON="generate-only (safe default)"

          if [ "$MODE" = "main" ] || [ "$MODE" = "subpath" ]; then
            DEPLOY=true
            TARGET="$MODE"
            REASON="explicit mode: $MODE"
          elif [ "$MODE" = "auto" ]; then
            if [ "$EXISTING" = "true" ]; then
              TARGET="subpath"
              DEPLOY=true
              REASON="auto: existing live site detected"
            else
              TARGET="main"
              DEPLOY=true
              REASON="auto: no live site detected"
            fi
          fi

          if [ "$DEPLOY" = "true" ] && [ "$CONFIRM" != "true" ]; then
            echo "::error::Deploy mode '$MODE' requires confirm_deploy=true."
            exit 1
          fi

          if [ "$TARGET" = "subpath" ] && [ "$BUILD_TYPE" = "workflow" ]; then
            echo "::warning::build_type=workflow; subpath preservation is not safe. Falling back to generate-only."
            DEPLOY=false
            TARGET="none"
            REASON="subpath preservation not safe with build_type=workflow"
          fi

          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Resolve RepoForge token
        id: token
        shell: bash
        run: |
          TOKEN="${{ secrets.GH_MODELS_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ github.token }}"
          fi
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Generate documentation
        id: generate
        continue-on-error: true
        uses: JNZader/repoforge@v0.1.0
        with:
          command: docs
          language: English
          output-dir: docs-build
          model: github/gpt-4o-mini
          github-token: ${{ steps.token.outputs.value }}

      - name: Summary
        shell: bash
        run: |
          echo "## RepoForge Smoke Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy mode: \`${{ steps.cfg.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing live Pages: \`${{ steps.preflight.outputs.existing_live }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages build_type: \`${{ steps.preflight.outputs.build_type }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plan reason: \`${{ steps.plan.outputs.reason }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Executed target: \`${{ steps.plan.outputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy enabled: \`${{ steps.plan.outputs.deploy }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generation step result: \`${{ steps.generate.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base Pages URL: ${{ steps.preflight.outputs.pages_url }}" >> "$GITHUB_STEP_SUMMARY"
